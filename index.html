<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <div class="header">
        <div class="logo">Header Logo</div>
        <ul class="links">
            <li><a href="#">header link one</a></li>
            <li><a href="#">header link two</a></li>
            <li><a href="#">header link three</a></li>
        </ul>
    </div>   
    <div class="content">
        <div class="hero-section">
            <div class="hero-left">
                <h1 class="hero-maintext">This website is awesome</h1>
                <p class="hero-subtext">This website has some subtext that goes here under the main title. 
                    It's a smaller font and the color is lower constrast.
                </p>
                <button class="signup-button">Sign up</button>
            </div>
            <img class="image-placeholder" alt="Placeholder">
        </div>
        <div class="info-section">
            <h1 class="info-header">Some random information.</h1>
            <div class="info-boxes">
                <div class="box"><p>test</p></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>
    </div>
    <div class="footer">
        <p>Copyright &copy; The Odin Project 2021</p>
    </div>
</div>

</body>
</html>
